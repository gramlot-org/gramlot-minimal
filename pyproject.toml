[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gramlot-standalone"
version = "0.0.0.dev0"
description = "Offline single-file packaging for Python-authored Gramlot applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
gramlot-standalone = "gramlot_standalone.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gramlot_standalone"]
